name: Release
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    # 标签必须与 ModBase.vb 中的 VersionBaseName 一致，否则启动器的版本比较会失效
    - name: Verify Version
      shell: pwsh
      run: |
        $tag = $env:GITHUB_REF_NAME
        $match = Select-String -Path 'Plain Craft Launcher 2\Modules\Base\ModBase.vb' -Pattern 'VersionBaseName As String = "([^"]+)"'
        if (-not $match) { Write-Error '无法从 ModBase.vb 中读取 VersionBaseName。' }
        $version = $match.Matches[0].Groups[1].Value
        $tagVersion = $tag -replace '^[vV]', ''
        if ($tagVersion -ne $version) {
          Write-Error "标签 $tag 与 ModBase.vb 中的 VersionBaseName（$version）不一致，请先修改版本号再打标签。"
        }
        "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "ASSET=OpenPCL-$tag.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"

    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release

    - name: Package
      shell: pwsh
      run: Copy-Item 'Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe' $env:ASSET

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        name: v${{ env.VERSION }}
        files: ${{ env.ASSET }}
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        fail_on_unmatched_files: true
